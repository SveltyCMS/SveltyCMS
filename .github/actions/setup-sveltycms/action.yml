name: Setup SveltyCMS
description: Install Bun, Node, dependencies and optionally restore build artifacts

inputs:
  bun-version:
    description: Bun version to install
    required: false
    default: "1.3.14"
  node-version:
    description: Node.js version to install
    required: false
    default: "24"
  restore-build:
    description: Whether to restore build-output and workspace-meta artifacts
    required: false
    default: "false"
  pnpm-run-install:
    description: When 'true', uses pnpm instead of bun for install (Windows workaround)
    required: false
    default: "false"

# Cache notes:
# - Key includes bun version + lockfile (+ config that can change install graph)
# - v3 prefix busts historically corrupted archives (digest-mismatch)
# - restore/save split: save only after successful install and only on miss
# - Single path (.bun-cache) avoids dual-directory digest skew
# - BUN_CACHE_DIR must match workflow env (default .bun-cache)

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Ensure Bun cache dir
      shell: bash
      run: mkdir -p .bun-cache

    - name: Restore Bun package cache
      id: cache-bun
      uses: actions/cache/restore@v6
      with:
        path: .bun-cache
        # v3: bust legacy dual-path / corrupt digests; include bun version for runtime skew
        key: bun-v3-${{ runner.os }}-${{ inputs.bun-version }}-${{ hashFiles('bun.lock', 'package.json') }}
        restore-keys: |
          bun-v3-${{ runner.os }}-${{ inputs.bun-version }}-
          bun-v3-${{ runner.os }}-
        enableCrossOsArchive: false
        fail-on-cache-miss: false

    - name: Install dependencies
      if: inputs.pnpm-run-install != 'true'
      shell: bash
      run: |
        echo "::group::bun install"
        bun install --frozen-lockfile --prefer-offline --cache-dir .bun-cache
        echo "::endgroup::"

    - name: Install dependencies (pnpm fallback)
      if: inputs.pnpm-run-install == 'true'
      shell: bash
      run: |
        echo "::group::pnpm install"
        pnpm install --frozen-lockfile --prefer-offline
        echo "::endgroup::"

    - name: Save Bun package cache
      if: success() && inputs.pnpm-run-install != 'true' && steps.cache-bun.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .bun-cache
        key: ${{ steps.cache-bun.outputs.cache-primary-key }}

    - name: Download build-output artifact
      if: inputs.restore-build == 'true'
      uses: actions/download-artifact@v8
      with:
        name: build-output
        path: .

    - name: Download workspace-meta artifact
      if: inputs.restore-build == 'true'
      uses: actions/download-artifact@v8
      with:
        name: workspace-meta
        path: .

    - name: Extract build-output tar.zst
      if: inputs.restore-build == 'true'
      shell: bash
      run: |
        if [ -f build-output.tar.zst ]; then
          tar --zstd -xf build-output.tar.zst
          rm build-output.tar.zst
        fi
