# .github/workflows/security-mutation.yml
# Nightly mutation run for the security surface.
#
# The four assurance checks already run on every pull request through
# `bun run check` (ci.yml, whitebox 01-policy), and the red-team corpus +
# invariants run in the unit suite. What is too slow for a PR is the mutation
# harness, so this workflow is the only place that produces a report for
# `scripts/security/check-test-strength.ts` to score.
name: Security Mutation

on:
  schedule:
    # Nightly, off the top of the hour to avoid the benchmark/e2e queues.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_CACHE_DIR: .bun-cache
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mutation:
    name: Mutation score + assurance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            .bun-cache
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Prepare Bun cache dir
        run: mkdir -p ${{ env.BUN_CACHE_DIR }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --prefer-offline --cache-dir ${{ env.BUN_CACHE_DIR }}

      - name: Generate Paraglide & SvelteKit types
        run: bun run paraglide && bun x svelte-kit sync

      - name: Mutate the security seams
        run: bun run test:mutation:security

      - name: Enforce mutation floors and every assurance gate
        run: bun run security:assurance --require-mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: .mutation/report.json
          if-no-files-found: warn
