name: CI

# CI Workflow for SveltyCMS
#
# Local developer entry points:
#   bun run test:all        # unit + integration (SQLite)
#   bun run test:e2e        # full E2E suite
#   bun run security        # OWASP scanner
#
# This workflow is the authoritative full matrix.
# Local hooks intentionally omit DB matrix, benchmarks, and E2E.
#
# Local tasks map to ci.yml jobs:
#   format + lint → whitebox
#   test:unit → whitebox unit
#   build → build
#   test:integration → db-tests
#   test:e2e → e2e
#
# Log policy (CI_QUIET=1):
#   - Cache: restore/save split; save only on success + miss (bun-v3- keys)
#   - Lint/format: ::group:: collapsed; oxlint --quiet --format=github
#   - Widget scripts: summary + failures only when CI/CI_QUIET
#   - Unit (Vitest): dot + github-actions; silent=passed-only
#   - Integration (bun test): --only-failures + summary box; server logs on fail
#   - E2E (Playwright): dot + github + HTML/JSON artifacts

on:
  push:
    branches: [main, next]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, next]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  # `next` and PR runs cancel superseded pushes. `main` keeps the SHA in the
  # group so a release run is never cancelled mid-flight by a follow-up push.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_CACHE_DIR: .bun-cache
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DO_NOT_TRACK: 1
  # Compact test/lint logs (failures still fully printed). Local runs stay verbose.
  CI_QUIET: "1"

jobs:
  # ------------------------------------------------
  # 1. Bootstrap — single source of truth for deps + codegen
  # ------------------------------------------------
  bootstrap:
    name: 🏁 Bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      pw-version: ${{ steps.pw.outputs.version }}
      test-secret: ${{ steps.secret-gen.outputs.secret }}
      db-matrix: ${{ steps.matrices.outputs.db }}
      e2e-matrix: ${{ steps.matrices.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Environment
        uses: ./.github/actions/setup-sveltycms
        with:
          bun-version: "1.3.14"
          node-version: "24"

      # Matrix generation is two `node` invocations over static TS files. Keep
      # it here instead of spending two extra runners (~7s each) on it.
      - name: Generate test matrices
        id: matrices
        run: |
          {
            echo "db=$(node .github/workflows/db-matrix.ts)"
            echo "e2e=$(node .github/workflows/e2e-matrix.ts)"
          } >> "$GITHUB_OUTPUT"

      - name: Verify Codegen
        run: |
          bun run paraglide
          bun x svelte-kit sync

      - name: Generate Test Secret
        id: secret-gen
        run: |
          mkdir -p tests/e2e/.auth
          if [ -n "${{ secrets.TEST_API_SECRET }}" ]; then
            SECRET_VAL="${{ secrets.TEST_API_SECRET }}"
          else
            SECRET_VAL="SVELTYCMS_CI_FALLBACK_$(date +%s)_${RANDOM}"
            echo "⚠️ Using CI fallback secret (fork PR or missing repo secret)"
          fi
          echo "$SECRET_VAL" > tests/e2e/.auth/test-secret.txt
          echo "secret=$SECRET_VAL" >> $GITHUB_OUTPUT

      - id: pw
        run: echo "version=$(bun x playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: workspace-meta
          include-hidden-files: true
          path: |
            src/paraglide
            .svelte-kit
            tests/e2e/.auth/test-secret.txt
          retention-days: 1

  # ------------------------------------------------
  # 1b. Docker image cache — DB fixtures pulled once, not per job
  # ------------------------------------------------
  # Every DB/bench job starts Docker Compose profiles. On a cold runner each job
  # re-pulled mongo (340MB) + the PostgreSQL UDH fixture (115MB), which added
  # ~5m30s to the mongodb job alone. Save the images once and load them per job.
  # mongo/mariadb/redis use mutable :latest tags, so the key carries a manual
  # suffix — bump it (v1 → v2) to refresh after a security update.
  docker-cache:
    name: 🐳 Docker Images
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Restore cached DB images
        id: cache
        uses: actions/cache@v6
        with:
          path: /tmp/docker-images
          key: docker-db-images-${{ runner.os }}-mongo-mariadb-pg18-redis-v1
      - name: Pull and save DB images
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker-images
          docker pull mongo:latest
          docker pull mariadb:latest
          docker pull postgres:18
          docker pull redis:latest
          docker save mongo:latest -o /tmp/docker-images/mongo.tar
          docker save mariadb:latest -o /tmp/docker-images/mariadb.tar
          docker save postgres:18 -o /tmp/docker-images/postgres.tar
          docker save redis:latest -o /tmp/docker-images/redis.tar

  # ------------------------------------------------
  # 1c. Change scope — benchmarks only for perf-sensitive paths
  # ------------------------------------------------
  # The core benchmark matrix is 4 runners and cannot observe UI/docs edits.
  # `main` always runs it (release gate); `next`/PR runs skip it unless a path
  # that can affect the persistence/HTTP hot path changed.
  changes:
    name: 🔍 Change Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bench: ${{ steps.scope.outputs.bench }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "bench=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="HEAD^"
          fi
          if git diff --name-only "$BASE" HEAD | grep -Eq '^(src/(databases|services/sdk|utils/media|routes/api|hooks|utils/rate-limit|content)/|package\.json|bun\.lock|vite\.config|svelte\.config|tests/benchmarks/|scripts/(runs|benchmark-matrix)/)'; then
            echo "bench=true" >> "$GITHUB_OUTPUT"
          else
            echo "bench=false" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------
  # 2. Quality gates (parallel, no artifact deps beyond bootstrap meta)
  # ------------------------------------------------
  whitebox:
    name: ${{ matrix.name }}
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static + policy checks share one runner. Each is seconds of work and
          # previously paid a full checkout + install (~6 extra runners). Format
          # and lint stay first so they fail fast.
          - task: 01-static
            name: 🖌️ Static & Policy Checks
            run: |
              echo "::group::oxfmt --check"
              bun run format --check
              echo "::endgroup::"
              echo "::group::oxlint"
              bun run lint:ci
              echo "::endgroup::"
              echo "::group::bun audit"
              timeout 60s bun audit --severity=high > bun-audit.log 2>&1 || true
              cat bun-audit.log
              echo "::endgroup::"
              echo "::group::secret misuse"
              bun run scripts/security/scan-secret-misuse.ts --strict
              echo "::endgroup::"
              echo "::group::hardware tiers"
              bun run scripts/probe/probe-hardware-tiers.ts
              echo "::endgroup::"
              echo "✅ Static and policy checks clean"
          - task: 03-check
            name: ✅ Quality Gate (check)
            # Format + lint already ran in 01-static; this job owns the
            # type-level, lockfile, and seam contracts.
            run: |
              echo "::group::lockfile-sync"
              bun run scripts/check/check-lockfile-sync.ts
              echo "::endgroup::"
              echo "::group::seams"
              bun run check:seams
              echo "::endgroup::"
              echo "::group::version:verify"
              bun run version:verify
              echo "::endgroup::"
              echo "::group::typecheck (tsc + svelte-check)"
              bun run typecheck
              echo "::endgroup::"
              echo "✅ Quality gate clean"
          - task: 04-unit
            name: ⚡ Unit Tests
            # --coverage runs the exact suite `bun run test:unit` (the pre-commit hook) runs
            # AND enforces the P0 floors in vitest.config.ts (lines 72 / funcs 72 /
            # branches 60 / statements 70), producing the json report Codecov uploads — so
            # the suite runs once, not twice. The mutation harness is excluded from the
            # coverage run (its temp-file dynamic import is incompatible with v8
            # instrumentation) and runs right after in the same job. The component
            # interaction suite (real client build, jsdom) runs last so a DOM regression
            # fails this job instead of only the E2E shards.
            run: |
              bun run test:unit:coverage
              bun run test:unit:components
              bun run test:mutation
          - task: 04b-tenant-gate
            name: 🛡️ Tenant Isolation Gate
            run: |
              echo "::group::tenant lint + unit"
              bun run test:tenant
              echo "::endgroup::"
          - task: 07-deploy-backdoor
            name: 🚪 Deploy Backdoor Probe (A01)
            run: bun run scripts/probe/probe-deploy-testing-api.ts
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-sveltycms
        with:
          bun-version: "1.3.14"
          node-version: "24"
      - name: Download workspace-meta
        uses: actions/download-artifact@v8
        with:
          name: workspace-meta
      # The static/policy job needs no Redis.
      - name: Restore cached DB images (Redis)
        if: matrix.task == '04-unit'
        uses: actions/cache/restore@v6
        with:
          path: /tmp/docker-images
          key: docker-db-images-${{ runner.os }}-mongo-mariadb-pg18-redis-v1
          restore-keys: |
            docker-db-images-${{ runner.os }}-
      - name: Load cached Redis image
        if: matrix.task == '04-unit'
        run: |
          shopt -s nullglob
          tars=(/tmp/docker-images/*redis*.tar)
          for f in "${tars[@]}"; do docker load -i "$f" >/dev/null; done
      # The CacheService L2 contract suite
      # (tests/unit/databases/cache-service-l2-contract.test.ts) drives a REAL Redis
      # across two service instances: tenant isolation, cross-instance invalidation,
      # the stampede lock and pub/sub L1 propagation. Without a Redis it skips
      # itself, which is how CI ended up running 4855 tests + 11 skipped while every
      # developer ran all 4866 — two different suites under one name. The profile has
      # a redis-cli healthcheck, so `--wait` returns only once it answers.
      - name: Start Redis (CacheService L2 contract)
        if: matrix.task == '04-unit'
        run: docker compose -f tests/docker-compose.yml --profile redis up -d --wait
      - name: Run Task
        run: ${{ matrix.run }}
        env:
          # Authoritative in the unit job: a Redis that fails to come up must fail the
          # suite loudly, not be swallowed as another silent skip. Empty elsewhere.
          TEST_REDIS_URL: ${{ matrix.task == '04-unit' && 'redis://127.0.0.1:6379' || '' }}
      - name: CVE Audit Summary
        if: matrix.task == '01-static'
        run: |
          echo "### 🔒 Dependency Audit (CVE Check)" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ -f bun-audit.log ] && grep -qi "0 vulnerabilities" bun-audit.log; then
            echo "| bun audit | ✅ No high/critical vulnerabilities |" >> $GITHUB_STEP_SUMMARY
          elif [ -f bun-audit.log ] && grep -qi "error" bun-audit.log; then
            echo "| bun audit | ⚠️ Audit completed with warnings/issues |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| bun audit | ℹ️ Audit completed |" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload coverage
        if: matrix.task == '04-unit' && success()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit

  # ------------------------------------------------
  # 3. Build — single artifact for all downstream jobs
  # ------------------------------------------------
  build:
    name: 🏗️ Build
    needs: [bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-sveltycms
        with:
          bun-version: "1.3.14"
          node-version: "24"
      - uses: actions/download-artifact@v8
        with: { name: workspace-meta }
      - name: Clean stale build output
        run: rm -rf build .svelte-kit/output
      - run: bun run build
        env:
          COMPILE_ALL_ADAPTERS: "true"
      - name: Verify benchmark build includes testing harness
        run: bun run scripts/security/verify-prod-build-backdoor.ts --mode=bench
      - name: Verify bundle size (no TipTap leak, entry < 80KB)
        run: bun run scripts/check/check-bundle-size.ts
      - name: Compute build artifact checksum
        run: |
          find build/ .svelte-kit/output/ -type f -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1 > build-checksum.txt
      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          include-hidden-files: true
          path: |
            build/
            .svelte-kit/output/
            build-checksum.txt
          retention-days: 1

  # ---------------------------------------------
  # 5. DB Integration Tests (Docker Compose profiles)
  # ------------------------------------------------
  db-tests:
    name: 🧪 DB (${{ matrix.db }})
    needs: [bootstrap, build, docker-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.bootstrap.outputs.db-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-sveltycms
        with:
          bun-version: "1.3.14"
          node-version: "24"
          restore-build: "true"
      # build/ + .svelte-kit/output/ + workspace-meta already arrive via `restore-build`
      # in the setup action — the explicit re-download duplicated the transfer.

      - name: Restore cached DB images
        uses: actions/cache/restore@v6
        with:
          path: /tmp/docker-images
          key: docker-db-images-${{ runner.os }}-mongo-mariadb-pg18-redis-v1
      - name: Load DB images (cache or network pull)
        run: |
          shopt -s nullglob
          tars=(/tmp/docker-images/*.tar)
          if [ ${#tars[@]} -gt 0 ]; then
            for f in "${tars[@]}"; do docker load -i "$f" >/dev/null; done
          else
            echo "::warning::DB image cache empty — docker compose will pull from the network"
          fi

      - name: Verify build artifact checksum
        run: |
          COMPUTED=$(find build/ .svelte-kit/output/ -type f -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1)
          EXPECTED=$(cat build-checksum.txt)
          if [ "$COMPUTED" != "$EXPECTED" ]; then
            echo "❌ Build artifact checksum mismatch!"
            echo "  Computed: $COMPUTED"
            echo "  Expected: $EXPECTED"
            exit 1
          fi
          echo "✅ Build artifact checksum verified"

      - name: Start Database (Docker Compose)
        if: matrix.db != 'sqlite'
        run: |
          docker compose -f tests/docker-compose.yml --profile ${{ matrix.db }} up -d --wait
          bun run scripts/probe/wait-for-ready.ts tcp:127.0.0.1:${{ matrix.port }} --timeout=90000 --interval=2000

      - name: Start UDH External Postgres Fixture
        if: matrix.db != 'postgresql'
        run: |
          docker compose -f tests/docker-compose.yml --profile postgresql up -d --wait
          bun run scripts/probe/wait-for-ready.ts tcp:127.0.0.1:5432 --timeout=90000 --interval=2000

      - name: Run Integration Tests
        env:
          DB_TYPE: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port || '' }}
          DB_NAME: sveltycms_test
          DB_USER: ${{ matrix.db_user }}
          DB_PASSWORD: ${{ matrix.db_password }}
          JWT_SECRET_KEY: Integration-Test-JWT-Secret-Key-2026
          ENCRYPTION_KEY: Integration-Encryption-Key-2026-32ch
          TEST_API_SECRET: ${{ needs.bootstrap.outputs.test-secret }}
          ADMIN_PASSWORD: Password123!
          TEST_MODE: true
          PASSWORD_MIN_LENGTH: 8
          PORT: "4173"
          # run-integration: --dots --only-failures + buffered server logs on fail
          CI_QUIET: "1"
        run: |
          echo "::group::integration (${{ matrix.db }})"
          # --strict-no-build: fail if artifact is deploy-stripped (do not rebuild in CI)
          bun run scripts/runs/run-integration.ts --strict-no-build --summary
          echo "::endgroup::"

      - name: Dump Docker Logs on Failure
        if: failure() && matrix.db != 'sqlite'
        run: docker compose -f tests/docker-compose.yml --profile ${{ matrix.db }} logs

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: db-log-${{ matrix.db }}
          path: preview.log
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------
  # 8. Core Benchmarks (fast perf gate per DB adapter)
  # ------------------------------------------------
  bench-core:
    name: 📊 Bench (${{ matrix.db }})
    needs: [bootstrap, build, docker-cache, changes]
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.bootstrap.outputs.db-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-sveltycms
        with:
          bun-version: "1.3.14"
          node-version: "24"
          restore-build: "true"
      # `restore-build` already downloads build-output — this re-downloaded the
      # (large) build artifact a second time.

      - name: Restore cached DB images
        uses: actions/cache/restore@v6
        with:
          path: /tmp/docker-images
          key: docker-db-images-${{ runner.os }}-mongo-mariadb-pg18-redis-v1
      - name: Load DB images (cache or network pull)
        run: |
          shopt -s nullglob
          tars=(/tmp/docker-images/*.tar)
          if [ ${#tars[@]} -gt 0 ]; then
            for f in "${tars[@]}"; do docker load -i "$f" >/dev/null; done
          else
            echo "::warning::DB image cache empty — docker compose will pull from the network"
          fi

      - name: Start Database
        if: matrix.db != 'sqlite'
        run: |
          docker compose -f tests/docker-compose.yml --profile ${{ matrix.db }} up -d --wait
          bun run scripts/probe/wait-for-ready.ts tcp:127.0.0.1:${{ matrix.port }} --timeout=90000 --interval=2000

      - name: Create UDH Fixture Database (PostgreSQL only)
        if: matrix.db == 'postgresql'
        run: |
          docker exec sveltycms-postgresql psql -U postgres -c "CREATE DATABASE sveltycms_udh_fixture;" 2>/dev/null || true

      - name: Start UDH External Postgres Fixture
        if: matrix.db != 'postgresql'
        run: |
          docker compose -f tests/docker-compose.yml --profile postgresql up -d --wait
          bun run scripts/probe/wait-for-ready.ts tcp:127.0.0.1:5432 --timeout=90000 --interval=2000

      - name: Run Core Benchmarks
        env:
          DB_TYPE: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port || '' }}
          DB_NAME: sveltycms_test
          DB_USER: ${{ matrix.db_user }}
          DB_PASSWORD: ${{ matrix.db_password }}
          ADMIN_PASSWORD: Password123!
          PASSWORD_MIN_LENGTH: 8
          # 🛡️ PRODUCTION PARITY: benchmark servers run NODE_ENV=production
          # without TEST_MODE — real sessions, rate limits, WAF, audits.
          NODE_ENV: production
          # 🏢 Audit mode: BENCHMARK_AUDIT_MODE=compliance enables the enterprise
          # audit chain (AUDIT_CHAIN_SYNC=true, DISABLE_AUDIT_LOGS=false).
          BENCHMARK_AUDIT_MODE: "production"
          RATE_LIMIT_MAX_REQUESTS: "20000"
          SECURITY_RATE_LIMIT_SCALE: "100"
          BENCHMARK_PROFILE: "ci-fresh"
          BENCHMARK_NO_REDIS: "1"
          BENCHMARK_RECORD: "1"
          TEST_API_SECRET: ${{ needs.bootstrap.outputs.test-secret }}
          UDH_PG_DATABASE: ${{ matrix.db == 'postgresql' && 'sveltycms_udh_fixture' || 'sveltycms_test' }}
        run: |
          mkdir -p tests/e2e/.auth
          if [ -n "${TEST_API_SECRET}" ]; then
            echo "${TEST_API_SECRET}" > tests/e2e/.auth/test-secret.txt
          else
            TEST_API_SECRET=$(cat tests/e2e/.auth/test-secret.txt)
          fi
          export TEST_API_SECRET
          set -o pipefail
          bun run scripts/runs/run-core-benchmarks.ts --db=${{ matrix.db }} 2>&1 | tee bench-output.log

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report-${{ matrix.db }}
          path: docs/project/benchmarks/benchmark_${{ matrix.db }}.mdx
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload benchmark log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-log-${{ matrix.db }}
          path: bench-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump Docker Logs on Failure
        if: failure() && matrix.db != 'sqlite'
        run: docker compose -f tests/docker-compose.yml --profile ${{ matrix.db }} logs

      - name: Teardown Docker
        if: always() && matrix.db != 'sqlite'
        run: |
          docker compose -f tests/docker-compose.yml --profile ${{ matrix.db }} down -v 2>/dev/null || true
          docker compose -f tests/docker-compose.yml --profile postgresql down -v 2>/dev/null || true

  # ------------------------------------------------
  bench-summary:
    name: 📊 Bench Summary
    needs: [bench-core]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download all benchmark reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: benchmark-report-*
          path: docs/project/benchmarks
          merge-multiple: true
      - name: Generate CI Summary
        continue-on-error: true
        run: node scripts/benchmark-matrix/generate-ci-markdown.ts

  # ------------------------------------------------
  # 6. E2E Prep — auth state only (single artifact)
  # ------------------------------------------------
  e2e-prep:
    name: 🧪 E2E Prep
    needs: [bootstrap, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_TYPE: sqlite
      DB_HOST: 127.0.0.1
      DB_NAME: e2e_auth_test
      DB_USER: ""
      DB_PASSWORD: ""
      PASSWORD_MIN_LENGTH: 8
      TEST_MODE: "true"
      SKIP_TEST_CLEANUP: "true"
      ADMIN_PASSWORD: Password123!
      JWT_SECRET_KEY: Integration-Test-JWT-Secret-Key-2026
      ENCRYPTION_KEY: Integration-Encryption-Key-2026-32ch
      TEST_API_SECRET: ${{ needs.bootstrap.outputs.test-secret }}
      PREVIEW_SECRET: Integration-Preview-Secret-2026
      HOST: 127.0.0.1
      PORT: 4173
      ORIGIN: http://127.0.0.1:4173
      # Tests must never be throttled. This is configuration, not a code bypass:
      # L1/L2 buckets still run and still enforce whatever ceiling is configured.
      RATE_LIMIT_MAX_REQUESTS: "1000000"
      RATE_LIMIT_COMMERCE_MAX_REQUESTS: "1000000"
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-sveltycms
        with:
          bun-version: "1.3.14"
          node-version: "24"
          restore-build: "true"
      # workspace-meta arrives via `restore-build` in the setup action.

      - name: Restore Playwright Browsers cache
        id: cache-playwright
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v2-${{ runner.os }}-${{ needs.bootstrap.outputs.pw-version }}
          restore-keys: |
            playwright-v2-${{ runner.os }}-
          fail-on-cache-miss: false

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: bun x playwright install --with-deps chromium

      - name: Install Playwright Deps Only
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: bun x playwright install-deps chromium

      - name: Save Playwright Browsers cache
        if: success() && steps.cache-playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.cache-playwright.outputs.cache-primary-key }}

      - name: Initialize and Start Preview Server
        run: |
          mkdir -p config config/database config/test-database tests/e2e/.auth logs mediaFolder config/collections

          cat > config/private.test.ts <<EOF
          export const privateEnv = {
            DB_TYPE: "sqlite",
            DB_HOST: "127.0.0.1",
            DB_NAME: "e2e_auth_test",
            DB_USER: "",
            DB_PASSWORD: "",
            JWT_SECRET_KEY: "Integration-Test-JWT-Secret-Key-2026",
            ENCRYPTION_KEY: "Integration-Encryption-Key-2026-32ch",
            TEST_API_SECRET: "${TEST_API_SECRET}",
            PREVIEW_SECRET: "Integration-Preview-Secret-2026",
            PASSWORD_MIN_LENGTH: 8,
            USE_REDIS: false,
            MULTI_TENANT: false,
            DEMO: false,
            HOST_PROD: "http://127.0.0.1:4173"
          };
          export const privateConfig = privateEnv;
          export default privateEnv;
          EOF

          cp config/private.test.ts config/private.ts

          if [ -n "${TEST_API_SECRET}" ]; then
            echo "${TEST_API_SECRET}" > tests/e2e/.auth/test-secret.txt
          else
            TEST_API_SECRET=$(cat tests/e2e/.auth/test-secret.txt)
            echo "TEST_API_SECRET=${TEST_API_SECRET}" >> $GITHUB_ENV
          fi

          # Prefer adapter-node entry (build/index.js) with correct ORIGIN for remotes.
          # Fall back to index.cjs (Plesk entry) only if needed — always pin ORIGIN.
          export ORIGIN="${ORIGIN:-http://127.0.0.1:4173}"
          # Strict setup gate: TEST_MODE relaxes the /setup→/login redirect and the
          # /api/setup 403 by design (so E2E can exercise the wizard). The wizard
          # project re-enables it via STRICT_SETUP_CHECK to verify the production
          # setup-exit contract (seeded-ready state must bounce /setup to /login).
          export STRICT_SETUP_CHECK=true
          if [ -f build/index.js ]; then
            node build/index.js > preview.log 2>&1 &
          else
            node index.cjs > preview.log 2>&1 &
          fi
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          trap "kill $SERVER_PID 2>/dev/null || true" INT TERM
          # HTTP readiness probe (not just TCP accept) — fails fast if the server exits.
          if ! bun run scripts/probe/wait-for-ready.ts http://127.0.0.1:4173/api/system/health --timeout=180000 --interval=500 --pid=$SERVER_PID; then
            echo "❌ Server did not become ready — crash in preview.log:"
            tail -100 preview.log
            exit 1
          fi
          echo "PLAYWRIGHT_TEST_BASE_URL=http://127.0.0.1:4173" >> $GITHUB_ENV
          echo "ORIGIN=${ORIGIN}" >> $GITHUB_ENV

      - name: Run E2E Wizard Setup
        run: bun x playwright test --project=wizard

      - name: Run E2E Auth Setup
        run: bun x playwright test --project=auth-setup

      # Fail closed: empty admin.json (CSRF-only / no auth_sessions) poisons every chromium shard
      # with missing page-title and 401s. Catch it here instead of after 15 min of flaky retries.
      - name: Verify auth storageState has session cookie
        run: |
          node -e '
            const fs = require("fs");
            const p = "tests/e2e/.auth/admin.json";
            if (!fs.existsSync(p)) { console.error("missing", p); process.exit(1); }
            const s = JSON.parse(fs.readFileSync(p, "utf8"));
            const names = (s.cookies || []).map((c) => c.name);
            const ok = names.some((n) => /auth_sessions/i.test(n));
            console.log("admin.json cookies:", names.join(", ") || "(none)");
            if (!ok) {
              console.error("FAIL: no auth_sessions cookie in admin.json — auth-setup did not establish a session");
              process.exit(1);
            }
            console.log("OK: session cookie present");
          '

      - name: Smart Playwright summary (wizard + auth-setup)
        if: always()
        run: bun run scripts/ci/ci-report-playwright.ts --label="E2E Prep (wizard + auth-setup)" --json=tests/playwright-results.json --preview=preview.log

      - name: Flake budget (wizard + auth-setup)
        if: always()
        run: bun run scripts/check/check-flake-budget.ts --json=tests/playwright-results.json --max-flaky=0 --allow-missing

      - name: Shutdown Preview Server
        if: always()
        run: |
          pkill -f "node build/index.js" || true
          pkill -f "node index.cjs" || true
          sleep 2

      - name: Archive E2E Environment (single artifact)
        run: tar --zstd -cf e2e-env.tar.zst build/ .svelte-kit/ src/paraglide/ tests/e2e/.auth/ config/private.ts config/private.test.ts config/database/ config/test-database/ config/collections/

      - uses: actions/upload-artifact@v7
        with:
          name: e2e-env-${{ github.sha }}
          path: e2e-env.tar.zst
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: playwright-report-Wizard-Auth
          path: |
            tests/playwright-report
            tests/playwright-results.json
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: preview-log-prep
          path: preview.log
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------
  # 7. E2E Tests — named groups with grep filtering
  # ------------------------------------------------
  # wizard + firstuser + auth-setup run sequentially in e2e-prep.
  # All other CMS route tests run here via named chromium shards.
  e2e:
    name: 🧪 E2E — ${{ matrix.name }}
    needs: [bootstrap, e2e-prep]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.bootstrap.outputs.e2e-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-sveltycms
        with:
          bun-version: "1.3.14"
          node-version: "24"
          pnpm-run-install: "false"

      - name: Download E2E Environment
        uses: actions/download-artifact@v8
        with:
          name: e2e-env-${{ github.sha }}
          path: .

      - name: Extract E2E Environment
        run: |
          if [ ! -f e2e-env.tar.zst ]; then
            echo "::error::E2E prep artifact missing. Re-run workflow."
            exit 1
          fi
          tar --zstd -xf e2e-env.tar.zst
          rm e2e-env.tar.zst
          mkdir -p config/collections

      # Restore-only: e2e-prep owns the Playwright browser cache save (avoids shard races).
      - name: Restore Playwright Browsers cache
        id: cache-playwright
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v2-${{ runner.os }}-${{ needs.bootstrap.outputs.pw-version }}
          restore-keys: |
            playwright-v2-${{ runner.os }}-
          fail-on-cache-miss: false

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: bun x playwright install --with-deps chromium

      - name: Install Playwright Deps Only
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: bun x playwright install-deps chromium

      - name: Run E2E Tests
        env:
          DB_TYPE: sqlite
          DB_HOST: 127.0.0.1
          DB_NAME: e2e_auth_test
          DB_USER: ""
          DB_PASSWORD: ""
          PASSWORD_MIN_LENGTH: 8
          TEST_MODE: "true"
          SKIP_TEST_CLEANUP: "true"
          ADMIN_PASSWORD: Password123!
          JWT_SECRET_KEY: Integration-Test-JWT-Secret-Key-2026
          ENCRYPTION_KEY: Integration-Encryption-Key-2026-32ch
          TEST_API_SECRET: ${{ needs.bootstrap.outputs.test-secret }}
          PREVIEW_SECRET: Integration-Preview-Secret-2026
          HOST: 127.0.0.1
          PORT: 4173
          ORIGIN: http://127.0.0.1:4173
          SKIP_E2E_DEPS: "true"
          # Tests must never be throttled (configuration, not a code bypass).
          RATE_LIMIT_MAX_REQUESTS: "1000000"
          RATE_LIMIT_COMMERCE_MAX_REQUESTS: "1000000"
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          if [ -z "${TEST_API_SECRET}" ]; then
            TEST_API_SECRET=$(cat tests/e2e/.auth/test-secret.txt)
          fi
          export TEST_API_SECRET
          export PLAYWRIGHT_TEST_BASE_URL=http://127.0.0.1:4173
          export ORIGIN="${ORIGIN:-http://127.0.0.1:4173}"
          if [ -f build/index.js ]; then
            node build/index.js > preview.log 2>&1 &
          else
            node index.cjs > preview.log 2>&1 &
          fi
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT INT TERM
          if ! bun run scripts/probe/wait-for-ready.ts http://127.0.0.1:4173/api/system/health --timeout=120000 --interval=500 --pid=$SERVER_PID; then
            echo "Server did not become ready - crash in preview.log:"
            tail -100 preview.log
            exit 1
          fi
          # playwright.config.ts: CI → dot + github + json (list is local-only)
          bun x playwright test \
            --project=chromium \
            --grep="${{ matrix.grep }}" \
            --shard=${{ matrix.shard }} \
            --workers=${{ matrix.workers }}

      - name: Smart Playwright summary
        if: always()
        run: bun run scripts/ci/ci-report-playwright.ts --label="E2E — ${{ matrix.name }}" --json=tests/playwright-results.json --preview=preview.log

      # Explicit flake budget: retries keep a shard green, so a retried-pass
      # ("flaky") hides instability. Budget: ≤2 per shard, ≤3% of executed
      # tests. Missing reports (server crash) are allowed — the test step owns
      # that failure.
      - name: Flake budget
        if: always()
        run: bun run scripts/check/check-flake-budget.ts --json=tests/playwright-results.json --max-flaky=2 --max-flake-rate=3 --allow-missing

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.name }}
          path: |
            tests/playwright-report
            tests/playwright-results.json
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-log-${{ matrix.name }}
          path: preview.log
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------
  # 10. All Green Gate
  # ------------------------------------------------
  all-green:
    name: ✅ All Green
    if: always()
    runs-on: ubuntu-latest
    needs:
      - bootstrap
      - build
      - docker-cache
      - changes
      - whitebox
      - e2e-prep
      - e2e
      - db-tests
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/ci/ci-report-all-green.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Job results dashboard
        if: always()
        env:
          RESULT_BOOTSTRAP: ${{ needs.bootstrap.result }}
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_WHITEBOX: ${{ needs.whitebox.result }}
          RESULT_E2E_PREP: ${{ needs.e2e-prep.result }}
          RESULT_E2E: ${{ needs.e2e.result }}
          RESULT_DB_TESTS: ${{ needs.db-tests.result }}
        run: bun run scripts/ci/ci-report-all-green.ts
      - if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: |
          echo "::error::One or more required jobs failed or were cancelled — see All-Green Gate summary for fix order"
          exit 1
      - if: ${{ !cancelled() && !failure() }}
        run: echo "✅ All checks passed"

  bench-green:
    name: 📊 Bench Green
    if: always()
    runs-on: ubuntu-latest
    needs:
      - bench-core
      - bench-summary
    steps:
      - if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: |
          echo "::warning::One or more benchmarks failed (non-blocking)"
      - if: ${{ !cancelled() && !failure() }}
        run: echo "✅ All benchmarks passed"
