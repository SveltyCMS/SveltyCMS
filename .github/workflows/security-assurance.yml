# .github/workflows/security-assurance.yml
# Scheduled run of the time-based assurance gates.
#
# Every code change already runs the full aggregate in `bun run check` and the
# CI whitebox job (`01-policy`), and the 31-seam mutation harness runs in the
# whitebox `04-unit` job (a 24-seam subset would be strictly redundant there).
# What an event-driven gate cannot notice is that *time* has passed: an advisory
# aging past its SLA, a threat model past its review window, or a stale
# external-validation claim. This workflow exists only for that clock.
name: Security Assurance (scheduled)

on:
  schedule:
    # Nightly, off the top of the hour to avoid the benchmark/e2e queues.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-assurance-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_CACHE_DIR: .bun-cache
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  assurance:
    name: Time-based assurance gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            .bun-cache
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Prepare Bun cache dir
        run: mkdir -p ${{ env.BUN_CACHE_DIR }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --prefer-offline --cache-dir ${{ env.BUN_CACHE_DIR }}

      - name: Generate Paraglide & SvelteKit types
        run: bun run paraglide && bun x svelte-kit sync

      # Mutation floors are enforced by the whitebox 04-unit job on every full
      # tier run; absence of a report here is expected (test-strength exits 0
      # with a notice), while the dated checks below still fail on a breach.
      - name: Time-based assurance (advisory SLA, threat-model age, external validation)
        run: bun run security:assurance
