name: CodeQL

# CodeQL semantic analysis (security-extended) — complements the custom static
# scanners in the pre-commit gate (scripts/scan-security-risk.ts + slop +
# secret-misuse). Different engine, same philosophy: catch vulnerability
# classes in OUR code, not just dependency CVEs.
#
# IMPORTANT: GitHub "default setup" for CodeQL cannot coexist with advanced
# workflow SARIF upload on the same repo. While default setup is enabled under
# Settings → Code security, this workflow must NOT upload on push (upload fails
# with: "CodeQL analyses from advanced configurations cannot be processed when
# the default setup is enabled").
#
# - Default setup: continuous results on `main` pushes and PRs (GitHub-managed)
# - This workflow: manual and weekly advanced queries (security-extended), no
#   upload while default setup is on. Re-enable upload after disabling default
#   setup.
#
# It deliberately does not run on `next` pushes: default setup already scans the
# PR that lands them, and `upload: never` means a push run would only prove the
# analysis completes while discarding every finding. Switch the repository to
# advanced setup (then drop `upload: never`) to make `next` coverage useful.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (JS/TS + Actions, security-extended)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript, actions
          queries: security-extended
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          # Avoid SARIF upload conflict with default setup; still fails the job
          # if analysis itself fails.
          upload: never
