name: CodeQL

# CodeQL semantic analysis (security-extended) — complements the custom static
# scanners in the pre-commit gate (scripts/scan-security-risk.ts + slop +
# secret-misuse). Different engine, same philosophy: catch vulnerability
# classes in OUR code, not just dependency CVEs.
#
# IMPORTANT: GitHub "default setup" for CodeQL cannot coexist with advanced
# workflow SARIF upload on the same repo. While default setup is enabled under
# Settings → Code security, this workflow must NOT upload on push (upload fails
# with: "CodeQL analyses from advanced configurations cannot be processed when
# the default setup is enabled").
#
# - Default setup: continuous results on push/PR (GitHub-managed)
# - This workflow: manual / weekly advanced queries (security-extended), no upload
#   when default setup is on. Re-enable upload after disabling default setup.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  # Intentionally no push/PR while default CodeQL setup is enabled (see above).

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (JS/TS, security-extended)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
          # Avoid SARIF upload conflict with default setup; still fails the job
          # if analysis itself fails.
          upload: never
