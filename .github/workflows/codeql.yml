name: CodeQL

# CodeQL semantic analysis (security-extended) — complements the custom static
# scanners in the pre-commit gate (scripts/scan-security-risk.ts + slop +
# secret-misuse). Different engine, same philosophy: catch vulnerability
# classes in OUR code, not just dependency CVEs.
#
# IMPORTANT: GitHub "default setup" for CodeQL cannot coexist with advanced
# workflow SARIF upload on the same repo. While default setup is enabled under
# Settings → Code security, this workflow must NOT upload on push (upload fails
# with: "CodeQL analyses from advanced configurations cannot be processed when
# the default setup is enabled").
#
# - Default setup: continuous results on `main` pushes and PRs (GitHub-managed)
# - This workflow: `next` pushes, manual and weekly advanced queries
#   (security-extended), no upload while default setup is on. Re-enable upload
#   after disabling default setup.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  # GitHub default setup scans the default branch (`main`) and PRs only, so a
  # push to `next` never gets a CodeQL analysis. Run this advanced workflow on
  # `next` pushes too (`upload: never` keeps it compatible with default setup).
  # Remove the branch restriction after switching the repo to advanced setup.
  push:
    branches: [next]

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (JS/TS + Actions, security-extended)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript, actions
          queries: security-extended
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          # Avoid SARIF upload conflict with default setup; still fails the job
          # if analysis itself fails.
          upload: never
