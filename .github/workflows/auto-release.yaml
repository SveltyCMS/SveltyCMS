# .github/workflows/auto-release.yaml
# Release triggers (each run has exactly one event; the job `if:` accepts all three):
#   1. CI succeeds on `main`  → release the version recorded in package.json.
#      When that version already has its `v*` tag and this commit is ahead of the
#      tag, derive the next version with scripts/version.ts (auto), commit it on
#      the CI SHA, push it to main, then tag and publish that commit.
#      A checkout that already is the tagged release is skipped.
#   2. a `v*` tag is pushed   → release from the tag name (manual/emergency fallback)
#   3. manual dispatch        → release the explicit `version` input (fallback), or the
#      `bump` input, which derives the next version and commits it back
# Tag pushes by github-actions[bot] are ignored so a release cannot loop.
#
# The bump is one commit on the SHA CI just validated. The tag points at that
# bump commit. The next CI run of the bump commit finds the tag and skips, so
# a release cannot bump itself again. The automatic path derives the next
# version from Conventional Commits since the last release (scripts/version.ts
# auto): feat → minor, breaking → major (minor on 0.x), otherwise patch. It runs
# only after the whole CI workflow — unit, integration, E2E and benchmarks —
# succeeded on `main`; a failed or partial run never touches the version.
#
# The GitHub Release is created independently of npm publish — a missing/invalid
# NPM_TOKEN or registry failure must never swallow the release (that previously
# left pushed tags with no GitHub Releases). npm publish is best-effort.
name: Auto Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to publish (e.g. 0.1.0) — overrides bump strategy"
        required: false
        type: string
      bump:
        description: "SemVer bump strategy if exact version omitted: auto (default), patch, minor, major"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.actor != 'github-actions[bot]') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node.js (for npm registry auth)
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pre-flight: package.json and sbom.json must agree on the version before
      # anything is tagged, so a hand-edited or stale SBOM can never ship under a
      # mismatched version. `scripts/version.ts --verify` is read-only.
      - name: Verify manifest and SBOM agree
        run: bun run version:verify

      # The release only proceeds on a fully green CI run on `main`. The
      # `workflow_run` trigger already requires `conclusion == success`; this
      # makes the unit / integration / E2E contract explicit and fails closed if
      # any job did not succeed (guards against a future `continue-on-error`).
      - name: Verify CI run fully passed (unit + integration + E2E)
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -uo pipefail
          if ! not_ok=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" --paginate \
              --jq '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | "\(.name): \(.conclusion)"'); then
            echo "::warning::Could not inspect CI jobs — relying on workflow conclusion=success."
            exit 0
          fi
          if [ -n "$not_ok" ]; then
            echo "::error::CI job(s) did not succeed — refusing to release:"
            printf '%s\n' "$not_ok"
            exit 1
          fi
          echo "✅ All CI jobs succeeded — releasing."

      - name: Validate manual version input
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        env:
          REQUESTED: ${{ github.event.inputs.version }}
        run: |
          if ! printf '%s' "$REQUESTED" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error title=Invalid version input::'$REQUESTED' is not a bare MAJOR.MINOR.PATCH SemVer."
            exit 1
          fi
          echo "✅ manual version input '$REQUESTED' is a valid SemVer"

      - name: Determine version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "source=git tag" >> $GITHUB_OUTPUT
          elif [ -n "$MANUAL_VERSION" ]; then
            echo "value=$MANUAL_VERSION" >> $GITHUB_OUTPUT
            echo "source=manual input" >> $GITHUB_OUTPUT
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual `bump` input: a human asked for the next version, so derive it
            # from the tags, write it into package.json, and commit the bump back.
            PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
            if git rev-parse "v$PKG_VERSION" >/dev/null 2>&1; then
              echo "ℹ️ Version v$PKG_VERSION already has a tag. Deriving next version via scripts/version.ts..."
              BUMP_STRATEGY="${BUMP_CHOICE:-auto}"
              bun run scripts/version.ts "$BUMP_STRATEGY"
              NEXT_VERSION=$(node -e "console.log(require('./package.json').version)")
              echo "value=$NEXT_VERSION" >> $GITHUB_OUTPUT
              echo "source=scripts/version.ts ($BUMP_STRATEGY)" >> $GITHUB_OUTPUT
              echo "bumped=true" >> $GITHUB_OUTPUT
            else
              echo "value=$PKG_VERSION" >> $GITHUB_OUTPUT
              echo "source=package.json" >> $GITHUB_OUTPUT
            fi
          else
            # Automatic path (a green CI run on main). A manifest version with
            # no tag is the release: tag it. A manifest version that already has
            # a tag is released only when HEAD is that tag. Any later commit
            # derives the next version onto this SHA from Conventional Commits
            # (feat → minor, breaking → major, else patch) and the steps below
            # commit, push, and tag it.
            PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
            if git rev-parse "v$PKG_VERSION" >/dev/null 2>&1; then
              TAG_SHA=$(git rev-parse "v$PKG_VERSION^{}")
              HEAD_SHA=$(git rev-parse HEAD)
              if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
                echo "value=$PKG_VERSION" >> $GITHUB_OUTPUT
                echo "source=already released" >> $GITHUB_OUTPUT
                echo "skip=true" >> $GITHUB_OUTPUT
              else
                echo "ℹ️ v$PKG_VERSION already has a tag and HEAD is ahead. Deriving the next version from Conventional Commits..."
                bun run scripts/version.ts auto
                NEXT_VERSION=$(node -e "console.log(require('./package.json').version)")
                if [ "$NEXT_VERSION" = "$PKG_VERSION" ]; then
                  echo "value=$PKG_VERSION" >> $GITHUB_OUTPUT
                  echo "source=package.json" >> $GITHUB_OUTPUT
                else
                  echo "value=$NEXT_VERSION" >> $GITHUB_OUTPUT
                  echo "source=scripts/version.ts (auto)" >> $GITHUB_OUTPUT
                  echo "bumped=true" >> $GITHUB_OUTPUT
                fi
              fi
            else
              echo "value=$PKG_VERSION" >> $GITHUB_OUTPUT
              echo "source=package.json" >> $GITHUB_OUTPUT
            fi
          fi
        env:
          MANUAL_VERSION: ${{ github.event.inputs.version }}
          BUMP_CHOICE: ${{ github.event.inputs.bump }}

      # Manual dispatch `bump`, and a CI pass whose package.json version is
      # already tagged while HEAD has moved on. The tag step below publishes
      # the commit this step pushes.
      - name: Commit version bump
        if: steps.version.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # scripts/version.ts is idempotent: when the derived version already matches
          # the manifest it writes nothing, and an empty `git commit` is a hard
          # failure. The manifest already holds the version to release, so tag it.
          if git diff --quiet -- package.json; then
            echo "::notice title=No version to write::package.json already holds v${{ steps.version.outputs.value }}"
            exit 0
          fi
          git commit -am "chore(release): bump version to v${{ steps.version.outputs.value }}"
          git push origin HEAD:${{ github.event.workflow_run.head_branch || 'main' }}

      # Green run: this checkout is already the tagged release. A later commit
      # takes the derive branch above instead of landing here.
      - name: Skipped release
        if: steps.version.outputs.skip == 'true'
        run: |
          echo "::notice title=Release skipped::v${{ steps.version.outputs.value }} already points at ${{ github.sha }}. Nothing to tag."
          echo "ℹ️ Skipped: this commit is already release v${{ steps.version.outputs.value }}."

      # An existing tag means this version was released before (e.g. a re-run):
      # skip idempotently. `bun run version:bump` refuses to derive an
      # already-tagged version locally, which is the fail-fast re-release guard.
      - name: Create git tag
        id: tag-step
        if: steps.version.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists — skipping tag creation"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
            echo "Created and pushed tag v$VERSION"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          VERSION: ${{ steps.version.outputs.value }}

      # Release first — the admin UI's update check reads GitHub Releases, so this
      # must happen even when npm publish cannot. softprops generates release notes
      # from the commit range since the last tag.
      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      # Fail loudly when a "successful" job produced no artifacts. The tag and the
      # Release are the products of this workflow — assert both exist.
      - name: Verify release artifacts
        id: verify-release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -uo pipefail
          if ! git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q "refs/tags/v$VERSION$"; then
            echo "::error title=Missing tag::v$VERSION was not pushed to origin"
            exit 1
          fi
          if ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error title=Missing release::GitHub Release v$VERSION was not created"
            exit 1
          fi
          echo "✅ verified tag + GitHub Release v$VERSION"

      # npm publish is best-effort and must never swallow the GitHub Release
      # (already created above). A missing token is a visible warning; a token npm
      # rejects is a visible error annotation — both leave the release intact and
      # both are reported in the job summary below.
      - name: Check npm publish readiness
        id: npm-auth
        if: steps.version.outputs.skip != 'true'
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning title=npm publish skipped::NPM_TOKEN is not set — the GitHub Release is unaffected."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! npm whoami >/dev/null 2>&1; then
            echo "::error title=npm publish skipped::NPM_TOKEN is present but npm rejected it (invalid or expired)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check existing npm version
        id: npm-check
        if: steps.version.outputs.skip != 'true' && steps.npm-auth.outputs.ready == 'true'
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          PKG_NAME=$(node -e "console.log(require('./package.json').name)")
          if npm view "${PKG_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "ℹ️ Version ${VERSION} is already published on npm — skipping publish"
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        id: npm-publish
        if: steps.version.outputs.skip != 'true' && steps.npm-auth.outputs.ready == 'true' && steps.npm-check.outputs.published != 'true'
        continue-on-error: true
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SOURCE: ${{ steps.version.outputs.source }}
          SKIPPED: ${{ steps.version.outputs.skip }}
          NPM_READY: ${{ steps.npm-auth.outputs.ready }}
          NPM_ALREADY: ${{ steps.npm-check.outputs.published }}
        run: |
          {
            echo "## Auto Release"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`v${VERSION:-none}\` |"
            echo "| Version source | ${SOURCE:-n/a} |"
            echo "| Skipped (already released) | ${SKIPPED:-false} |"
            echo "| npm auth ready | ${NPM_READY:-false} |"
            echo "| npm already published | ${NPM_ALREADY:-n/a} |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
