# .github/workflows/auto-release.yaml
# Release triggers (each run has exactly one event; the job `if:` accepts all three):
#   1. CI succeeds on `main`  → release the version recorded in package.json (primary path)
#   2. a `v*` tag is pushed   → release from the tag name (manual/emergency fallback)
#   3. manual dispatch        → release the explicit `version` input (fallback)
# Tag pushes by github-actions[bot] are ignored so a release cannot loop.
#
# The GitHub Release is created independently of npm publish — a missing/invalid
# NPM_TOKEN or registry failure must never swallow the release (that previously
# left pushed tags with no GitHub Releases). npm publish is best-effort.
name: Auto Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.0.x) — only needed for manual trigger"
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.actor != 'github-actions[bot]') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node.js (for npm registry auth)
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "source=git tag" >> $GITHUB_OUTPUT
          elif [ -n "$MANUAL_VERSION" ]; then
            echo "value=$MANUAL_VERSION" >> $GITHUB_OUTPUT
            echo "source=manual input" >> $GITHUB_OUTPUT
          else
            PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
            echo "value=$PKG_VERSION" >> $GITHUB_OUTPUT
            echo "source=package.json" >> $GITHUB_OUTPUT
          fi
        env:
          MANUAL_VERSION: ${{ github.event.inputs.version }}

      # An existing tag means this version was released before (e.g. a re-run):
      # skip idempotently. `bun run version:bump` refuses to derive an
      # already-tagged version locally, which is the fail-fast re-release guard.
      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists — skipping tag creation"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
            echo "Created and pushed tag v$VERSION"
          fi
        env:
          VERSION: ${{ steps.version.outputs.value }}

      # Release first — the admin UI's update check reads GitHub Releases, so this
      # must happen even when npm publish cannot. softprops generates release notes
      # from the commit range since the last tag.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify npm authentication
        id: npm-auth
        continue-on-error: true
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "❌ NPM_TOKEN secret is empty or missing from repository secrets"
            exit 1
          fi
          npm whoami || { echo "❌ npm token is invalid or expired — skipping npm publish"; exit 1; }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: steps.npm-auth.outcome == 'success'
        continue-on-error: true
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
