# .github/workflows/auto-release.yaml
# Release triggers (each run has exactly one event; the job `if:` accepts all three):
#   1. CI succeeds on `main`  → release the version recorded in package.json (primary path)
#   2. a `v*` tag is pushed   → release from the tag name (manual/emergency fallback)
#   3. manual dispatch        → release the explicit `version` input (fallback)
# Tag pushes by github-actions[bot] are ignored so a release cannot loop.
#
# The GitHub Release is created independently of npm publish — a missing/invalid
# NPM_TOKEN or registry failure must never swallow the release (that previously
# left pushed tags with no GitHub Releases). npm publish is best-effort.
name: Auto Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to publish (e.g. 0.1.0) — overrides bump strategy"
        required: false
        type: string
      bump:
        description: "SemVer bump strategy if exact version omitted: auto (default), patch, minor, major"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.actor != 'github-actions[bot]') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node.js (for npm registry auth)
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "source=git tag" >> $GITHUB_OUTPUT
          elif [ -n "$MANUAL_VERSION" ]; then
            echo "value=$MANUAL_VERSION" >> $GITHUB_OUTPUT
            echo "source=manual input" >> $GITHUB_OUTPUT
          else
            PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
            # If the current package.json version is already tagged, derive the next SemVer version:
            if git rev-parse "v$PKG_VERSION" >/dev/null 2>&1; then
              echo "ℹ️ Version v$PKG_VERSION already has a tag. Deriving next version via scripts/version.ts..."
              BUMP_STRATEGY="${BUMP_CHOICE:-auto}"
              bun run scripts/version.ts "$BUMP_STRATEGY"
              NEXT_VERSION=$(node -e "console.log(require('./package.json').version)")
              echo "value=$NEXT_VERSION" >> $GITHUB_OUTPUT
              echo "source=scripts/version.ts ($BUMP_STRATEGY)" >> $GITHUB_OUTPUT
              echo "bumped=true" >> $GITHUB_OUTPUT
            else
              echo "value=$PKG_VERSION" >> $GITHUB_OUTPUT
              echo "source=package.json" >> $GITHUB_OUTPUT
            fi
          fi
        env:
          MANUAL_VERSION: ${{ github.event.inputs.version }}
          BUMP_CHOICE: ${{ github.event.inputs.bump }}

      # If version was bumped by script, commit updated package.json to repository
      - name: Commit version bump
        if: steps.version.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): bump version to v${{ steps.version.outputs.value }}"
          git push origin HEAD:${{ github.event.workflow_run.head_branch || 'main' }}

      # An existing tag means this version was released before (e.g. a re-run):
      # skip idempotently. `bun run version:bump` refuses to derive an
      # already-tagged version locally, which is the fail-fast re-release guard.
      - name: Create git tag
        id: tag-step
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists — skipping tag creation"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
            echo "Created and pushed tag v$VERSION"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          VERSION: ${{ steps.version.outputs.value }}

      # Release first — the admin UI's update check reads GitHub Releases, so this
      # must happen even when npm publish cannot. softprops generates release notes
      # from the commit range since the last tag.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      # ── Container image (ghcr.io) ───────────────────────────────────────────
      # Multi-arch (amd64 + arm64) production image. ghcr.io has no anonymous
      # pull rate-limits (unlike Docker Hub), and `packages: write` is already
      # granted at the workflow level. The GitHub Release was created earlier, so
      # a registry failure here never swallows it.
      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata (SemVer + latest)
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sveltycms/sveltycms
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=v${{ steps.version.outputs.value }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify npm authentication
        id: npm-auth
        continue-on-error: true
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "❌ NPM_TOKEN secret is empty or missing from repository secrets"
            exit 1
          fi
          npm whoami || { echo "❌ npm token is invalid or expired — skipping npm publish"; exit 1; }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check existing npm version
        id: npm-check
        if: steps.npm-auth.outcome == 'success'
        continue-on-error: true
        run: |
          PKG_NAME=$(node -e "console.log(require('./package.json').name)")
          if npm view "${PKG_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "ℹ️ Version ${VERSION} is already published on npm — skipping publish"
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi
        env:
          VERSION: ${{ steps.version.outputs.value }}

      - name: Publish to npm
        if: steps.npm-auth.outcome == 'success' && steps.npm-check.outputs.published != 'true'
        continue-on-error: true
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
