<!--
  @file src/app.html
  @description SvelteKit HTML shell template.
  SvelteKit 3.0.0-next.25 does NOT process the `%sveltekit.lang%` placeholder
  (only head/body/assets are replaced) — a raw placeholder leaked into every
  SSR response. Hardcode `en` to match the `dir="ltr"` default; the CMS
  manages content languages at the content layer, not the html tag.
-->
<!doctype html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="utf-8" />
    <script src="/theme-init.js"></script>
    <link rel="icon" href="%sveltekit.assets%/SveltyCMS_Logo.svg" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover" data-theme="sveltycms">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
